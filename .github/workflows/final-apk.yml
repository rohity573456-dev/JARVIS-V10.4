name: JARVIS Final APK

on:
  push:
    branches:
      - "project-jarvis-super-ai/**"

permissions:
  contents: read

jobs:
  build-final-apk:
    if: contains(github.event.head_commit.message, '[final-apk]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'
      - name: Run final tests and build installable APK
        run: |
          gradle testDebugUnitTest assembleDebug
          mkdir -p final-apk
          cp app/build/outputs/apk/debug/app-debug.apk final-apk/JARVIS-V10.4-Final.apk
      - name: Upload final APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-V10.4-Final-APK
          path: final-apk/JARVIS-V10.4-Final.apk
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
