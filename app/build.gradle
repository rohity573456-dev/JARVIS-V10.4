plugins {
    id 'com.android.application'
}

android {
    namespace 'com.jarvis.personalassistant'
    compileSdk 35

    defaultConfig {
        applicationId 'com.jarvis.personalassistant'
        minSdk 26
        targetSdk 35
        versionCode 22
        versionName '10.4-onnx-wake-migration'
        ndk { abiFilters 'arm64-v8a' }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // Sherpa and OpenWakeWord both bundle ONNX Runtime 1.17.1 for arm64.
    // Keep one shared native runtime in the APK; the Java/JNI bindings remain included.
    packaging {
        jniLibs {
            pickFirsts += ['**/libonnxruntime.so']
        }
    }

}

dependencies {
    testImplementation 'junit:junit:4.13.2'

    // Temporary compatibility baseline. Remove only after ONNX cutover is validated.
    implementation files('libs/sherpa-onnx-2.0.1.aar')

    // OpenWakeWord-compatible ONNX pipeline; custom Jarvis classifier is loaded from assets.
    implementation 'com.github.msnilsen:openwakeword-android:0.1.0'

    implementation 'com.google.ai.edge.litertlm:litertlm-android:0.16.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
}
